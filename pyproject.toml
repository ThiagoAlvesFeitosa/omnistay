[project]
name = "omnistay"
version = "0.1.0"
description = "Hub conversacional para hotelaria"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "postgres: teste que exige PostgreSQL acessivel via DATABASE_URL",
]
