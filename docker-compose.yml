services:
  postgres:
    image: postgres:16
    container_name: omnistay-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: omnistay
      POSTGRES_DB: omnistay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omnistay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
